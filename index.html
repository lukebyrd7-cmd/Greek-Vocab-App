<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Puritan Parser</title>

<style>
:root{
  --accent:#4e8f6e;
  --bg:#fbfdfb;
  --card:#ffffff;
  --muted:#666;
  --text:#111;
  --border:rgba(0,0,0,0.06);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial;
}
.dark{
  --bg:#0f1720;
  --card:#0b1216;
  --muted:#9aa4ab;
  --text:#e6eef2;
  --border:rgba(255,255,255,0.06);
}
body{margin:0;background:var(--bg);color:var(--text);padding:18px}
header{display:flex;align-items:center;gap:16px;margin-bottom:14px}
.logo{width:44px;height:44px;border-radius:8px;
display:flex;align-items:center;justify-content:center;
font-weight:700;color:var(--accent);border:2px solid var(--border)}
.tabs{display:flex;gap:8px;margin:12px 0}
.tab{padding:8px 12px;border-radius:8px;border:1px solid var(--border);
background:transparent;color:var(--text);cursor:pointer}
.tab.active{background:var(--accent);color:#fff}
.panel{background:var(--card);padding:14px;border-radius:10px}
.btn{background:var(--accent);color:#fff;border:none;
padding:6px 10px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);
border:1px solid var(--border)}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid var(--border)}
input,select{padding:6px;border-radius:6px;border:1px solid var(--border);
background:transparent;color:var(--text)}
.accent-picker{display:flex;gap:6px;margin-top:6px}
.color-btn{width:28px;height:28px;border-radius:6px;border:none;cursor:pointer}
.theme-btn{margin-right:6px;padding:4px 8px;border-radius:6px;
border:1px solid var(--border);background:transparent;color:var(--text)}
.theme-btn.active{background:var(--accent);color:#fff}
</style>
</head>
<body>

<header>
  <div class="logo">PP</div>
  <div>
    <h1>Puritan Parser</h1>
    <div style="color:var(--muted)">Greek 25+ | Hebrew 60+</div>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-lang="greek">Greek</button>
  <button class="tab" data-lang="hebrew">Hebrew</button>
</div>

<div class="panel">
  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">
    <input id="search" placeholder="Search...">
    <select id="sort">
      <option value="freq-desc">Frequency ↓</option>
      <option value="freq-asc">Frequency ↑</option>
      <option value="az">A → Z</option>
      <option value="za">Z → A</option>
    </select>
  </div>

  <table>
    <thead>
      <tr><th>Word</th><th>Lemma</th><th>Gloss</th><th>POS</th><th>Freq</th></tr>
    </thead>
    <tbody id="table"></tbody>
  </table>
</div>

<div class="panel" style="margin-top:14px">
  <strong>Accent Color</strong>
  <div class="accent-picker">
    <button class="color-btn" style="background:#4e8f6e" data-color="#4e8f6e"></button>
    <button class="color-btn" style="background:#246b9c" data-color="#246b9c"></button>
    <button class="color-btn" style="background:#8a2b2b" data-color="#8a2b2b"></button>
    <button class="color-btn" style="background:#d97706" data-color="#d97706"></button>
    <button class="color-btn" style="background:#475569" data-color="#475569"></button>
  </div>

  <div style="margin-top:12px">
    <strong>Theme</strong><br>
    <button class="theme-btn" data-theme="light">Light</button>
    <button class="theme-btn" data-theme="dark">Dark</button>
  </div>
</div>

<script>
let state={lang:"greek",data:{greek:[],hebrew:[]}};

async function loadData(){
  const greek=await fetch("greek_25plus.json").then(r=>r.json());
  const hebrew=await fetch("hebrew_60plus.json").then(r=>r.json());
  state.data.greek=greek;
  state.data.hebrew=hebrew;
  render();
}
loadData();

function render(){
  const list=state.data[state.lang]||[];
  const q=document.getElementById("search").value.toLowerCase();
  let filtered=list.filter(x=>
    x.word.toLowerCase().includes(q)||
    x.lemma.toLowerCase().includes(q)||
    x.gloss.toLowerCase().includes(q)
  );
  const sort=document.getElementById("sort").value;
  filtered.sort((a,b)=>{
    if(sort==="freq-desc")return b.freq-a.freq;
    if(sort==="freq-asc")return a.freq-b.freq;
    if(sort==="az")return a.word.localeCompare(b.word);
    if(sort==="za")return b.word.localeCompare(a.word);
  });
  const tbody=document.getElementById("table");
  tbody.innerHTML="";
  filtered.forEach(r=>{
    tbody.innerHTML+=`<tr>
      <td>${r.word}</td>
      <td>${r.lemma}</td>
      <td>${r.gloss}</td>
      <td>${r.pos}</td>
      <td>${r.freq}</td>
    </tr>`;
  });
}

document.querySelectorAll(".tab").forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    state.lang=t.dataset.lang;
    render();
  }
});
document.getElementById("search").oninput=render;
document.getElementById("sort").onchange=render;

document.querySelectorAll(".color-btn").forEach(b=>{
  b.onclick=()=>{
    document.documentElement.style.setProperty("--accent",b.dataset.color);
  };
});
document.querySelectorAll(".theme-btn").forEach(b=>{
  b.onclick=()=>{
    document.documentElement.classList.toggle("dark",b.dataset.theme==="dark");
    document.querySelectorAll(".theme-btn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
  };
});
</script>
</body>
</html>
