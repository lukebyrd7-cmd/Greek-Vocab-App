<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Puritan Parser</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

<script src="https://cdn.tailwindcss.com"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap');
.greek-text { font-family: 'Noto Serif', serif; }

.loader {
  border: 3px solid #334155;
  border-top: 3px solid #60a5fa;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  animation: spin 1s linear infinite;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>

<body class="bg-slate-950 text-slate-200 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-sm bg-slate-900 rounded-3xl p-6 shadow-2xl border border-slate-800 relative flex flex-col h-[600px]">

  <!-- HEADER -->
  <div class="flex justify-between items-end mb-6 pb-4 border-b border-slate-800">
    <div>
      <h1 class="text-blue-400 font-bold text-lg tracking-tight">The Puritan Parser</h1>
      <p class="text-slate-500 text-[10px] uppercase tracking-widest font-semibold">
        Spaced Repetition Engine
      </p>
    </div>
    <div class="text-right">
      <div class="text-[10px] text-slate-500 font-bold mb-1">MASTERED</div>
      <div class="flex items-baseline justify-end">
        <span id="mastered-count" class="text-xl font-mono text-green-400">0</span>
        <span class="text-xs text-slate-600 ml-1">/ <span id="total-count">0</span></span>
      </div>
    </div>
  </div>

  <!-- LOADING -->
  <div id="loading" class="absolute inset-0 bg-slate-900/95 z-50 flex flex-col items-center justify-center rounded-3xl">
    <div class="loader mb-4"></div>
    <p id="loading-text" class="text-blue-400 text-xs font-bold tracking-widest animate-pulse">
      LOADING VOCAB…
    </p>
  </div>

  <!-- CARD -->
  <div class="flex-grow flex flex-col justify-center relative">

    <div class="absolute top-0 left-0 right-0 flex justify-center space-x-1 opacity-50" id="star-container"></div>

    <div class="text-center">
      <div id="word-tag" class="text-[10px] font-bold text-slate-600 uppercase mb-3 tracking-[0.2em]">—</div>

      <h2 id="greek-word" class="greek-text text-5xl font-bold mb-6 text-white">…</h2>

      <div id="answer" class="hidden">
        <p id="definition" class="text-2xl text-blue-300 italic mb-6"></p>
        <div class="bg-slate-800/50 rounded-xl p-4 border border-slate-700/50 text-left">
          <p class="text-[10px] text-slate-500 uppercase font-bold mb-2">
            Context <span id="ref"></span>
          </p>
          <p id="sentence" class="greek-text text-lg text-slate-300"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="mt-6 pt-4">
    <div id="reveal-actions">
      <button onclick="reveal()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-2xl">
        Reveal
      </button>
    </div>

    <div id="grade-actions" class="hidden grid grid-cols-2 gap-3">
      <button onclick="grade(false)" class="bg-slate-800 text-red-400 py-4 rounded-2xl">
        Forgot
      </button>
      <button onclick="grade(true)" class="bg-green-600 text-white py-4 rounded-2xl">
        Knew It
      </button>
    </div>
  </div>

</div>

<script>
// ==========================
// CONFIG
// ==========================
const DATA_URL = "https://raw.githubusercontent.com/lukebyrd7-cmd/Greek-Vocab-App/main/vocab.json";
const STORAGE_KEY = "puritan-parser-progress";
let minFrequency = 0;

// ==========================
// STATE
// ==========================
let vocab = [];
let progress = {};
let current = null;

// ==========================
// UTIL
// ==========================
function today() {
  return Date.now();
}

// ==========================
// LOAD / SAVE
// ==========================
function loadProgress() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) progress = JSON.parse(saved);
  } catch (e) {
    console.warn("Failed to load progress:", e);
    progress = {};
  }
}

function saveProgress() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  } catch (e) {
    console.warn("Failed to save progress:", e);
  }
  updateStats();
}

// ==========================
// INIT
// ==========================
async function init() {
  try {
    loadProgress();

    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error("Fetch failed");

    vocab = await res.json();

    if (!Array.isArray(vocab)) {
      throw new Error("Invalid vocab format");
    }

    vocab.forEach(v => {
      if (!progress[v.lemma]) {
        progress[v.lemma] = { level: 0, interval: 0, due: today() };
      }
    });

    document.getElementById("loading").classList.add("hidden");
    updateStats();
    nextCard();

  } catch (err) {
    console.error(err);
    document.getElementById("loading-text").innerText = "FAILED TO LOAD VOCAB";
  }
}

// ==========================
// FILTERING
// ==========================
function filteredVocab() {
  return vocab.filter(v => v.frequency >= minFrequency);
}

function dueCards() {
  return filteredVocab().filter(v => progress[v.lemma].due <= today());
}

// ==========================
// CARD SELECTION
// ==========================
function nextCard() {
  const available = filteredVocab();
  if (!available.length) {
    document.getElementById("greek-word").innerText = "No vocab found.";
    return;
  }

  const due = dueCards();
  const pool = due.length ? due : available;

  let weighted = [];
  pool.forEach(v => {
    const lvl = progress[v.lemma].level;
    const weight = Math.max(1, 6 - lvl);
    for (let i = 0; i < weight; i++) weighted.push(v);
  });

  current = weighted[Math.floor(Math.random() * weighted.length)];
  render();
}

// ==========================
// RENDER
// ==========================
function render() {
  if (!current) return;

  document.getElementById("greek-word").innerText = current.lemma;
  document.getElementById("definition").innerText = current.gloss;
  document.getElementById("word-tag").innerText = current.pos || "";
  document.getElementById("sentence").innerText = current.example || "";
  document.getElementById("ref").innerText = current.ref || "";

  renderStars(progress[current.lemma].level);

  document.getElementById("answer").classList.add("hidden");
  document.getElementById("reveal-actions").classList.remove("hidden");
  document.getElementById("grade-actions").classList.add("hidden");
}

function renderStars(level) {
  const c = document.getElementById("star-container");
  c.innerHTML = "";
  for (let i = 0; i < 5; i++) {
    const d = document.createElement("div");
    d.className =
      "w-1.5 h-1.5 rounded-full " +
      (i < level ? "bg-green-400" : "bg-slate-700");
    c.appendChild(d);
  }
}

// ==========================
// ACTIONS
// ==========================
function reveal() {
  document.getElementById("answer").classList.remove("hidden");
  document.getElementById("reveal-actions").classList.add("hidden");
  document.getElementById("grade-actions").classList.remove("hidden");
}

function grade(correct) {
  if (!current) return;

  const p = progress[current.lemma];
  const intervals = [0, 1, 3, 7, 21, 60];

  if (correct) {
    p.level = Math.min(p.level + 1, 5);
    p.interval = intervals[p.level];
  } else {
    p.level = 0;
    p.interval = 1;
  }

  p.due = today() + p.interval * 86400000;
  saveProgress();
  nextCard();
}

// ==========================
// STATS
// ==========================
function updateStats() {
  const active = filteredVocab();
  document.getElementById("total-count").innerText = active.length;

  const mastered = active.filter(v => progress[v.lemma]?.level === 5).length;
  document.getElementById("mastered-count").innerText = mastered;
}

init();
</script>

</body>
</html>
